[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rigol"
version = "0.1.0"
description = "Biblioteca Python para comunicação com osciloscópios Rigol"
authors = [
    {name = "Carlos Eduardo de Lima Pereira"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyvisa",
    "pyvisa-py",
    "numpy"
]

[tool.setuptools]
packages = ["rigol"]